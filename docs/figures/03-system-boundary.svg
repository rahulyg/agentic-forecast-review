<svg viewBox="0 0 720 380" width="720" height="380" xmlns="http://www.w3.org/2000/svg">
<style>text{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}</style>
<rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
    <defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs>
    <rect x="10" y="20" width="110" height="56" rx="6" fill="#e5f3ea" stroke="#2f7a4f"/>
    <text x="65" y="44" text-anchor="middle" font-size="11" font-weight="700">Analyst</text>
    <text x="65" y="60" text-anchor="middle" font-size="9.5" fill="#5b6475">request + scope</text>
    <rect x="150" y="20" width="130" height="56" rx="6" fill="#e8f0f8" stroke="#2f5d8a"/>
    <text x="215" y="40" text-anchor="middle" font-size="11" font-weight="700">Preflight</text>
    <text x="215" y="55" text-anchor="middle" font-size="9.2" fill="#5b6475">access + input validity</text>
    <text x="215" y="68" text-anchor="middle" font-size="9.2" fill="#5b6475">pins snapshot ID</text>
    <rect x="310" y="10" width="200" height="140" rx="8" fill="#fbf0e2" stroke="#a8641a" stroke-width="1.4"/>
    <text x="410" y="32" text-anchor="middle" font-size="12" font-weight="700">Agent loop (ADK)</text>
    <text x="410" y="50" text-anchor="middle" font-size="9.5" fill="#5b6475">one model via OpenRouter</text>
    <g font-size="9.8" fill="#1c2230">
      <text x="324" y="72">• pick next tool + arguments</text>
      <text x="324" y="88">• follow up, clarify, or stop</text>
      <text x="324" y="104">• short decision summary</text>
      <text x="324" y="120">• interpretation with pointer tokens</text>
    </g>
    <rect x="330" y="128" width="160" height="16" rx="3" fill="#efe8f8" stroke="#6a3fa0"/>
    <text x="410" y="140" text-anchor="middle" font-size="9" fill="#6a3fa0">budget: 8 model turns · 8 tool calls</text>
    <rect x="310" y="185" width="200" height="40" rx="6" fill="#e8f0f8" stroke="#2f5d8a"/>
    <text x="410" y="202" text-anchor="middle" font-size="10.5" font-weight="700">Tool gateway + validator</text>
    <text x="410" y="217" text-anchor="middle" font-size="9" fill="#5b6475">schema check · retry charged to budget</text>
    <g font-size="9.8">
      <rect x="10" y="260" width="134" height="46" rx="5" fill="#e8f0f8" stroke="#2f5d8a"/><text x="77" y="279" text-anchor="middle" font-weight="700">1 Resolve context</text><text x="77" y="294" text-anchor="middle" fill="#5b6475" font-size="8.6">dates, series, versions</text>
      <rect x="152" y="260" width="134" height="46" rx="5" fill="#e8f0f8" stroke="#2f5d8a"/><text x="219" y="279" text-anchor="middle" font-weight="700">2 Compare runs</text><text x="219" y="294" text-anchor="middle" fill="#5b6475" font-size="8.6">MAE, bias, counts</text>
      <rect x="294" y="260" width="134" height="46" rx="5" fill="#e8f0f8" stroke="#2f5d8a"/><text x="361" y="279" text-anchor="middle" font-weight="700">3 Inspect series</text><text x="361" y="294" text-anchor="middle" fill="#5b6475" font-size="8.6">values, slices, chart data</text>
      <rect x="436" y="260" width="134" height="46" rx="5" fill="#e8f0f8" stroke="#2f5d8a"/><text x="503" y="279" text-anchor="middle" font-weight="700">4 Check quality</text><text x="503" y="294" text-anchor="middle" fill="#5b6475" font-size="8.6">gaps, dupes, mismatches</text>
      <rect x="578" y="260" width="134" height="46" rx="5" fill="#e8f0f8" stroke="#2f5d8a"/><text x="645" y="279" text-anchor="middle" font-weight="700">5 Evidence rows</text><text x="645" y="294" text-anchor="middle" fill="#5b6475" font-size="8.6">exact cited records</text>
    </g>
    <rect x="200" y="330" width="320" height="40" rx="6" fill="#f3f4f7" stroke="#2f5d8a"/>
    <text x="360" y="347" text-anchor="middle" font-size="10.5" font-weight="700">Versioned snapshot (fingerprinted, read-only)</text>
    <text x="360" y="362" text-anchor="middle" font-size="9" fill="#5b6475">observations · forecasts · derived metrics (manifest stored elsewhere)</text>
    <rect x="550" y="20" width="160" height="130" rx="8" fill="#e8f0f8" stroke="#2f5d8a"/>
    <text x="630" y="40" text-anchor="middle" font-size="11.5" font-weight="700">Packet assembler</text>
    <g font-size="9.4" fill="#1c2230">
      <text x="562" y="60">• resolves pointer tokens</text>
      <text x="572" y="73">from validated tool fields</text>
      <text x="562" y="89">• attaches source-row refs</text>
      <text x="562" y="105">• rejects stray digits</text>
      <text x="562" y="121">• labels findings vs. unknowns</text>
      <text x="562" y="137">• writes trace + replay file</text>
    </g>
    <g stroke="#5b6475" stroke-width="1.4" fill="none" marker-end="url(#a2)">
      <line x1="120" y1="48" x2="148" y2="48"/>
      <line x1="280" y1="48" x2="308" y2="48"/>
      <line x1="510" y1="70" x2="548" y2="70"/>
      <line x1="395" y1="150" x2="395" y2="183"/>
      <line x1="77" y1="258" x2="380" y2="227"/>
      <line x1="219" y1="258" x2="390" y2="227"/>
      <line x1="361" y1="258" x2="405" y2="227"/>
      <line x1="503" y1="258" x2="420" y2="227"/>
      <line x1="645" y1="258" x2="432" y2="227"/>
      <line x1="360" y1="330" x2="360" y2="308"/>
    </g>
    <line x1="425" y1="185" x2="425" y2="152" stroke="#5b6475" stroke-width="1.4" marker-end="url(#a2)"/>
    <text x="300" y="172" text-anchor="end" font-size="8.6" fill="#5b6475">typed call</text>
    <text x="432" y="172" font-size="8.6" fill="#5b6475">bounded observation</text>
    <path d="M630 150 L630 240 L512 240" stroke="#5b6475" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#a2)"/>
    <text x="636" y="200" font-size="8.6" fill="#5b6475">re-reads cited</text>
    <text x="636" y="212" font-size="8.6" fill="#5b6475">fields via tool 5</text>
    <path d="M630 20 L630 6 L65 6 L65 18" stroke="#2f7a4f" stroke-width="1.2" fill="none" marker-end="url(#a2)"/>
  </svg>
