<svg viewBox="0 0 720 230" width="720" height="230" xmlns="http://www.w3.org/2000/svg">
<style>text{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}</style>
<rect x="0" y="0" width="720" height="230" fill="#ffffff"/>
    <defs><marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs>
    <rect x="10" y="80" width="140" height="60" rx="6" fill="#fbf0e2" stroke="#a8641a"/>
    <text x="80" y="104" text-anchor="middle" font-size="10.5" font-weight="700">W3: run matched</text>
    <text x="80" y="120" text-anchor="middle" font-size="10.5" font-weight="700">pair × 3 each</text>
    <polygon points="250,60 330,110 250,160 170,110" fill="#efe8f8" stroke="#6a3fa0" stroke-width="1.4"/>
    <text x="250" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#6a3fa0">All 3 criteria</text>
    <text x="250" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#6a3fa0">met?</text>
    <rect x="380" y="20" width="160" height="50" rx="6" fill="#e5f3ea" stroke="#2f7a4f"/>
    <text x="460" y="42" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f7a4f">GO</text>
    <text x="460" y="58" text-anchor="middle" font-size="9" fill="#5b6475">continue to the W4 baseline</text>
    <rect x="380" y="150" width="160" height="56" rx="6" fill="#fbf0e2" stroke="#a8641a"/>
    <text x="460" y="170" text-anchor="middle" font-size="10.5" font-weight="700">One revision</text>
    <text x="460" y="185" text-anchor="middle" font-size="9" fill="#5b6475">tool outputs / prompt only</text>
    <text x="460" y="198" text-anchor="middle" font-size="9" fill="#5b6475">≤ 1 weekend, then re-test</text>
    <rect x="570" y="150" width="140" height="56" rx="6" fill="#f8e6e6" stroke="#a23b3b"/>
    <text x="640" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a23b3b">STOP the agent</text>
    <text x="640" y="185" text-anchor="middle" font-size="9" fill="#5b6475">publish the evaluation</text>
    <text x="640" y="198" text-anchor="middle" font-size="9" fill="#5b6475">harness and its finding</text>
    <g stroke="#5b6475" stroke-width="1.4" fill="none" marker-end="url(#a8)">
      <line x1="150" y1="110" x2="168" y2="110"/>
      <path d="M290 85 L378 45"/>
      <path d="M290 135 L378 178"/>
      <line x1="540" y1="178" x2="568" y2="178"/>
      <path d="M460 150 L460 120 L330 112" stroke-dasharray="4 3"/>
    </g>
    <text x="318" y="78" font-size="9" fill="#2f7a4f">yes</text>
    <text x="330" y="168" font-size="9" fill="#a23b3b">no</text>
    <text x="554" y="220" text-anchor="middle" font-size="8.6" fill="#a23b3b">still no</text>
    <text x="400" y="128" font-size="8.6" fill="#5b6475">re-test</text>
  </svg>
