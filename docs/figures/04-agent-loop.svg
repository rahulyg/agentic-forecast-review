<svg viewBox="0 0 720 400" width="720" height="400" xmlns="http://www.w3.org/2000/svg">
<style>text{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}</style>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
    <defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs>
    <rect x="20" y="30" width="110" height="44" rx="22" fill="#e5f3ea" stroke="#2f7a4f"/>
    <text x="75" y="57" text-anchor="middle" font-size="11" font-weight="700">Request in</text>
    <rect x="155" y="30" width="120" height="44" rx="6" fill="#e8f0f8" stroke="#2f5d8a"/>
    <text x="215" y="50" text-anchor="middle" font-size="11" font-weight="700">Preflight</text>
    <text x="215" y="65" text-anchor="middle" font-size="9" fill="#5b6475">pin snapshot, validate</text>
    <rect x="300" y="20" width="170" height="64" rx="8" fill="#fbf0e2" stroke="#a8641a" stroke-width="1.4"/>
    <text x="385" y="44" text-anchor="middle" font-size="11.5" font-weight="700">Decide next step</text>
    <text x="385" y="60" text-anchor="middle" font-size="9" fill="#5b6475">model turn n ≤ 8</text>
    <text x="385" y="73" text-anchor="middle" font-size="9" fill="#5b6475">reads all observations so far</text>
    <polygon points="590,16 650,52 590,88 530,52" fill="#efe8f8" stroke="#6a3fa0"/>
    <text x="590" y="50" text-anchor="middle" font-size="10" font-weight="700" fill="#6a3fa0">Budget</text>
    <text x="590" y="63" text-anchor="middle" font-size="9" fill="#6a3fa0">left?</text>
    <rect x="520" y="140" width="140" height="56" rx="6" fill="#e8f0f8" stroke="#2f5d8a"/>
    <text x="590" y="162" text-anchor="middle" font-size="11" font-weight="700">Tool call</text>
    <text x="590" y="177" text-anchor="middle" font-size="9" fill="#5b6475">call k ≤ 8 · validate args</text>
    <text x="590" y="189" text-anchor="middle" font-size="9" fill="#5b6475">and output schema</text>
    <rect x="520" y="218" width="140" height="42" rx="6" fill="#f3f4f7" stroke="#2f5d8a"/>
    <text x="590" y="235" text-anchor="middle" font-size="10.5" font-weight="700">Trace log</text>
    <text x="590" y="250" text-anchor="middle" font-size="9" fill="#5b6475">args · result · summary → replay</text>
    <rect x="360" y="148" width="130" height="44" rx="6" fill="#f8e6e6" stroke="#a23b3b"/>
    <text x="425" y="166" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a23b3b">Bad args / timeout</text>
    <text x="425" y="181" text-anchor="middle" font-size="9" fill="#5b6475">one retry, charged to budget</text>
    <g>
      <rect x="20" y="290" width="160" height="80" rx="8" fill="#e5f3ea" stroke="#2f7a4f" stroke-width="1.4"/>
      <text x="100" y="312" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f7a4f">ANSWER</text>
      <text x="100" y="330" text-anchor="middle" font-size="9.2">supported findings +</text>
      <text x="100" y="344" text-anchor="middle" font-size="9.2">“not established” section</text>
      <rect x="196" y="290" width="160" height="80" rx="8" fill="#e5f3ea" stroke="#2f7a4f" stroke-width="1.4"/>
      <text x="276" y="312" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f7a4f">CLARIFY</text>
      <text x="276" y="330" text-anchor="middle" font-size="9.2">names what is missing:</text>
      <text x="276" y="344" text-anchor="middle" font-size="9.2">metric / window / series / period</text>
      <rect x="372" y="290" width="160" height="80" rx="8" fill="#e5f3ea" stroke="#2f7a4f" stroke-width="1.4"/>
      <text x="452" y="312" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f7a4f">STOP — UNTRUSTWORTHY</text>
      <text x="452" y="330" text-anchor="middle" font-size="9.2">comparison incomplete;</text>
      <text x="452" y="344" text-anchor="middle" font-size="9.2">affected rows listed</text>
      <rect x="548" y="290" width="160" height="80" rx="8" fill="#f8e6e6" stroke="#a23b3b" stroke-width="1.4"/>
      <text x="628" y="312" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a23b3b">INCOMPLETE</text>
      <text x="628" y="330" text-anchor="middle" font-size="9.2">budget exhausted or tool</text>
      <text x="628" y="344" text-anchor="middle" font-size="9.2">failed; partial evidence only</text>
      <text x="628" y="358" text-anchor="middle" font-size="9.2">no invented conclusion</text>
    </g>
    <g stroke="#5b6475" stroke-width="1.4" fill="none" marker-end="url(#a3)">
      <line x1="130" y1="52" x2="153" y2="52"/>
      <line x1="275" y1="52" x2="298" y2="52"/>
      <line x1="470" y1="52" x2="528" y2="52"/>
      <line x1="590" y1="88" x2="590" y2="138"/>
      <path d="M540 140 L540 112 L430 112 L430 86"/>
      <line x1="520" y1="160" x2="492" y2="160"/>
      <line x1="492" y1="180" x2="518" y2="180"/>
      <line x1="590" y1="196" x2="590" y2="216"/>
      <path d="M650 52 L700 52 L700 288"/>
      <path d="M340 84 L340 272 L100 272 L100 288"/>
      <path d="M340 272 L276 272 L276 288"/>
      <path d="M340 272 L452 272 L452 288"/>
    </g>
    <text x="478" y="46" font-size="8.6" fill="#5b6475">wants a tool</text>
    <text x="596" y="118" font-size="8.6" fill="#6a3fa0">yes</text>
    <text x="692" y="46" font-size="8.6" fill="#a23b3b">no</text>
    <text x="436" y="106" font-size="8.6" fill="#5b6475">observation → next turn</text>
    <text x="494" y="155" font-size="8" fill="#a23b3b">error</text>
    <text x="494" y="194" font-size="8" fill="#5b6475">retry</text>
    <text x="346" y="130" font-size="8.6" fill="#5b6475">model chooses</text>
    <text x="346" y="142" font-size="8.6" fill="#5b6475">a terminal state</text>
  </svg>
