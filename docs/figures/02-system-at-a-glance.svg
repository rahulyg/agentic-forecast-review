<svg viewBox="0 0 720 360" width="720" height="360" xmlns="http://www.w3.org/2000/svg">
<style>text{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}</style>
<rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
    <defs><marker id="g1s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5b6475"/></marker><marker id="g1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs>
    <!-- data -->
    <rect x="10" y="40" width="130" height="120" rx="8" fill="#e8f0f8" stroke="#2f5d8a" stroke-width="1.4"/>
    <text x="75" y="62" text-anchor="middle" font-size="11.5" font-weight="700">Synthetic data</text>
    <g font-size="9.2" fill="#1c2230" text-anchor="middle">
      <text x="75" y="82">30 store-category series</text>
      <text x="75" y="97">2 forecast models</text>
      <text x="75" y="112">planted defects</text>
      <text x="75" y="127">versioned snapshot</text>
      <text x="75" y="142">+ fingerprint</text>
    </g>
    <!-- case -->
    <rect x="10" y="200" width="130" height="66" rx="8" fill="#e8f0f8" stroke="#2f5d8a"/>
    <text x="75" y="220" text-anchor="middle" font-size="11" font-weight="700">Test case</text>
    <text x="75" y="237" text-anchor="middle" font-size="9" fill="#5b6475">request text +</text>
    <text x="75" y="250" text-anchor="middle" font-size="9" fill="#5b6475">structured scope</text>
    <rect x="10" y="290" width="130" height="52" rx="8" fill="#efe8f8" stroke="#6a3fa0"/>
    <text x="75" y="310" text-anchor="middle" font-size="10" font-weight="700" fill="#6a3fa0">Hidden manifest</text>
    <text x="75" y="326" text-anchor="middle" font-size="8.8" fill="#5b6475">what was planted</text>

    <!-- tools -->
    <rect x="180" y="40" width="160" height="120" rx="8" fill="#e8f0f8" stroke="#2f5d8a" stroke-width="1.4"/>
    <text x="260" y="62" text-anchor="middle" font-size="11.5" font-weight="700">Five read-only tools</text>
    <g font-size="9.2" fill="#1c2230">
      <text x="194" y="82">1 resolve review context</text>
      <text x="194" y="97">2 compare forecast runs</text>
      <text x="194" y="112">3 inspect selected series</text>
      <text x="194" y="127">4 check data quality</text>
      <text x="194" y="142">5 retrieve evidence rows</text>
    </g>

    <!-- agent and baseline -->
    <rect x="380" y="20" width="160" height="70" rx="8" fill="#fbf0e2" stroke="#a8641a" stroke-width="1.4"/>
    <text x="460" y="42" text-anchor="middle" font-size="11.5" font-weight="700">Agent loop</text>
    <text x="460" y="58" text-anchor="middle" font-size="9" fill="#5b6475">reads request text, picks tools</text>
    <text x="460" y="71" text-anchor="middle" font-size="9" fill="#5b6475">≤ 8 turns · ≤ 8 tool calls</text>
    <text x="460" y="84" text-anchor="middle" font-size="9" fill="#5b6475">ADK + OpenRouter model</text>
    <rect x="380" y="110" width="160" height="70" rx="8" fill="#e8f0f8" stroke="#2f5d8a" stroke-width="1.4"/>
    <text x="460" y="132" text-anchor="middle" font-size="11.5" font-weight="700">Scripted baseline</text>
    <text x="460" y="148" text-anchor="middle" font-size="9" fill="#5b6475">reads structured scope</text>
    <text x="460" y="161" text-anchor="middle" font-size="9" fill="#5b6475">fixed rules, no call limit</text>
    <text x="460" y="174" text-anchor="middle" font-size="9" fill="#5b6475">frozen before testing</text>

    <!-- packet -->
    <rect x="580" y="40" width="130" height="120" rx="8" fill="#ffffff" stroke="#1c2230" stroke-width="1.4"/>
    <text x="645" y="62" text-anchor="middle" font-size="11.5" font-weight="700">Review packet</text>
    <g font-size="9" fill="#1c2230" text-anchor="middle">
      <text x="645" y="82">end state</text>
      <text x="645" y="97">findings + source rows</text>
      <text x="645" y="112">“not established”</text>
      <text x="645" y="127">tool trace</text>
      <text x="645" y="142">cost and calls</text>
    </g>

    <!-- grading -->
    <rect x="380" y="220" width="160" height="56" rx="8" fill="#e8f0f8" stroke="#2f5d8a"/>
    <text x="460" y="242" text-anchor="middle" font-size="11" font-weight="700">Code grader</text>
    <text x="460" y="258" text-anchor="middle" font-size="9" fill="#5b6475">facts, end state, leaks, refs</text>
    <rect x="380" y="290" width="160" height="52" rx="8" fill="#e5f3ea" stroke="#2f7a4f"/>
    <text x="460" y="312" text-anchor="middle" font-size="11" font-weight="700">Human rubric</text>
    <text x="460" y="328" text-anchor="middle" font-size="9" fill="#5b6475">completeness, explanation</text>
    <rect x="580" y="240" width="130" height="84" rx="8" fill="#f3f4f7" stroke="#1c2230" stroke-width="1.4"/>
    <text x="645" y="262" text-anchor="middle" font-size="11" font-weight="700">Result</text>
    <text x="645" y="280" text-anchor="middle" font-size="9" fill="#5b6475">agent vs script,</text>
    <text x="645" y="293" text-anchor="middle" font-size="9" fill="#5b6475">paired by case</text>
    <text x="645" y="306" text-anchor="middle" font-size="9" fill="#5b6475">+ replay + write-up</text>

    <g stroke="#5b6475" stroke-width="1.4" fill="none" marker-end="url(#g1)">
      <line x1="140" y1="100" x2="178" y2="100"/>
      <line x1="342" y1="85" x2="378" y2="58" marker-start="url(#g1s)"/>
      <line x1="342" y1="115" x2="378" y2="142" marker-start="url(#g1s)"/>
      <path d="M140 233 L360 233 L360 72 L378 72"/>
      <path d="M360 160 L378 160"/>
      <line x1="540" y1="55" x2="578" y2="80"/>
      <line x1="540" y1="145" x2="578" y2="120"/>
      <path d="M645 160 L645 200 L470 200 L470 218"/>
      <path d="M470 200 L370 200 L370 316 L378 316"/>
      <line x1="540" y1="248" x2="578" y2="270"/>
      <line x1="540" y1="316" x2="578" y2="300"/>
      <path d="M140 316 L170 316 L170 290 L320 290 L320 260 L378 260" stroke="#6a3fa0" stroke-dasharray="4 3"/>
    </g>
    <text x="250" y="284" font-size="8.4" fill="#6a3fa0" text-anchor="middle">grader only</text>
    
    <text x="560" y="195" font-size="8.4" fill="#5b6475" text-anchor="middle">packets</text>
  </svg>
