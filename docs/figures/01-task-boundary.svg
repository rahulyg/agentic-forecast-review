<svg viewBox="0 0 720 150" width="720" height="150" xmlns="http://www.w3.org/2000/svg">
<style>text{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}</style>
<rect x="0" y="0" width="720" height="150" fill="#ffffff"/>
    <rect x="10" y="10" width="340" height="130" rx="8" fill="#e5f3ea" stroke="#2f7a4f"/>
    <text x="24" y="32" font-size="12" font-weight="700" fill="#2f7a4f">In scope: retrospective review</text>
    <g font-size="10.3" fill="#1c2230">
      <text x="24" y="54">• Which matched series and windows got worse</text>
      <text x="24" y="72">• Whether the comparison can be trusted</text>
      <text x="24" y="90">• Where a miss is concentrated (as observed)</text>
      <text x="24" y="108">• What to inspect next; what is not established</text>
      <text x="24" y="126">• Asking back when “worse” is ambiguous</text>
    </g>
    <rect x="370" y="10" width="340" height="130" rx="8" fill="#f8e6e6" stroke="#a23b3b"/>
    <text x="384" y="32" font-size="12" font-weight="700" fill="#a23b3b">Out of scope: the agent may not</text>
    <g font-size="10.3" fill="#1c2230">
      <text x="384" y="54">• Produce or replace a forecast</text>
      <text x="384" y="72">• Retrain, promote or roll back a model</text>
      <text x="384" y="90">• Change replenishment or inventory decisions</text>
      <text x="384" y="108">• Name a real-world cause (stockout, promotion)</text>
      <text x="384" y="126">• Treat zero sales as proof of zero demand</text>
    </g>
  </svg>
