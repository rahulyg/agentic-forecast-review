<svg viewBox="0 0 720 270" width="720" height="270" xmlns="http://www.w3.org/2000/svg">
<style>text{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}</style>
<rect x="0" y="0" width="720" height="270" fill="#ffffff"/>
    <defs><marker id="a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs>
    <rect x="10" y="70" width="150" height="110" rx="8" fill="#e8f0f8" stroke="#2f5d8a" stroke-width="1.4"/>
    <text x="85" y="90" text-anchor="middle" font-size="11" font-weight="700">Case</text>
    <g font-size="9.2" fill="#1c2230">
      <text x="22" y="110">case_id · family_id</text>
      <text x="22" y="126">snapshot_id</text>
      <text x="22" y="142" fill="#2f7a4f" font-weight="700">request_text</text>
      <text x="22" y="158" fill="#2f5d8a" font-weight="700">canonical_scope</text>
      <text x="22" y="172" fill="#5b6475" font-size="8.4">(empty where ambiguous)</text>
    </g>
    <rect x="10" y="200" width="150" height="58" rx="6" fill="#efe8f8" stroke="#6a3fa0"/>
    <text x="85" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="#6a3fa0">Manifest (grader only)</text>
    <text x="85" y="234" text-anchor="middle" font-size="8.8" fill="#5b6475">expected_terminal</text>
    <text x="85" y="248" text-anchor="middle" font-size="8.8" fill="#5b6475">expected_missing · planted</text>
    <rect x="200" y="30" width="150" height="56" rx="6" fill="#fbf0e2" stroke="#a8641a"/>
    <text x="275" y="52" text-anchor="middle" font-size="10.5" font-weight="700">Agent</text>
    <text x="275" y="68" text-anchor="middle" font-size="8.8" fill="#5b6475">reads request_text</text>
    <text x="275" y="80" text-anchor="middle" font-size="8.8" fill="#5b6475">≤ 8 turns / 8 calls</text>
    <rect x="200" y="140" width="150" height="56" rx="6" fill="#e8f0f8" stroke="#2f5d8a"/>
    <text x="275" y="162" text-anchor="middle" font-size="10.5" font-weight="700">Scripted baseline</text>
    <text x="275" y="178" text-anchor="middle" font-size="8.8" fill="#5b6475">reads canonical_scope</text>
    <text x="275" y="190" text-anchor="middle" font-size="8.8" fill="#5b6475">no call cap · calls logged</text>
    <rect x="378" y="20" width="194" height="190" rx="8" fill="#ffffff" stroke="#1c2230" stroke-width="1.4"/>
    <text x="475" y="40" text-anchor="middle" font-size="11" font-weight="700">Shared packet schema</text>
    <g font-size="9" fill="#1c2230">
      <text x="388" y="60">terminal_state ∈ {ANSWER,</text>
      <text x="398" y="73">CLARIFY, STOP_UNTRUSTWORTHY,</text>
      <text x="398" y="86">INCOMPLETE}</text>
      <text x="388" y="104">claims[ label, template, refs ]</text>
      <text x="398" y="117" fill="#5b6475">numbers only via {ev:…} tokens</text>
      <text x="388" y="135">clarify{ missing[ ], options }</text>
      <text x="388" y="153">not_established[ ]</text>
      <text x="388" y="171">trace[ turn, tool, args,</text>
      <text x="398" y="184">result_hash, observation_refs≤2 ]</text>
      <text x="388" y="200">cost{ turns, calls, usd, secs }</text>
    </g>
    <rect x="600" y="40" width="110" height="70" rx="6" fill="#e8f0f8" stroke="#2f5d8a"/>
    <text x="655" y="60" text-anchor="middle" font-size="10.5" font-weight="700">Code grader</text>
    <text x="655" y="76" text-anchor="middle" font-size="8.6" fill="#5b6475">state vs manifest</text>
    <text x="655" y="89" text-anchor="middle" font-size="8.6" fill="#5b6475">missing vs expected</text>
    <text x="655" y="102" text-anchor="middle" font-size="8.6" fill="#5b6475">leak + ref checks</text>
    <rect x="600" y="140" width="110" height="34" rx="6" fill="#f3f4f7" stroke="#1c2230"/>
    <text x="655" y="161" text-anchor="middle" font-size="9.5" font-weight="700">Paired comparison</text>
    <rect x="600" y="190" width="110" height="46" rx="6" fill="#fbf0e2" stroke="#a8641a"/>
    <text x="655" y="208" text-anchor="middle" font-size="9.5" font-weight="700">Ambiguity slice</text>
    <text x="655" y="224" text-anchor="middle" font-size="8.4" fill="#5b6475">reported separately</text>
    <g stroke="#5b6475" stroke-width="1.4" fill="none" marker-end="url(#a9)">
      <path d="M160 140 L180 140 L180 58 L198 58"/>
      <path d="M160 158 L180 158 L180 168 L198 168"/>
      <line x1="350" y1="58" x2="376" y2="70"/>
      <line x1="350" y1="168" x2="376" y2="150"/>
      <line x1="572" y1="75" x2="598" y2="75"/>
      <line x1="655" y1="110" x2="655" y2="138"/>
      <path d="M700 110 L712 110 L712 186"/>
      <path d="M160 229 L585 229 L585 95 L598 95" stroke-dasharray="4 3"/>
    </g>
    <text x="650" y="127" font-size="8" fill="#5b6475" text-anchor="end">non-ambiguous</text>
    <text x="366" y="244" font-size="8.4" fill="#6a3fa0">ground truth, never visible to agent or script</text>
  </svg>
