[project]
name = "agentic-forecast-review"
version = "0.1.0"
description = "Code owns the numbers; the model owns bounded choices. An evidence-linked agent loop and offline evaluation suite for time-series review."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
]


[project.scripts]
verify-seal = "agentic_forecast_review.sealing:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.3.1",
    "nbdev>=3.3.27",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.uv.build-backend]
module-name = "agentic_forecast_review"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Generated from nbs/; nbdev writes __all__ in notebook order.
"src/agentic_forecast_review/*.py" = ["RUF022"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.nbdev]
lib_path = "src/agentic_forecast_review"
put_version_in_init = false
clear_all = true
tst_flags = "notest"
