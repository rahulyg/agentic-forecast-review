repos:
  - repo: local
    hooks:
      - id: export-and-clean-notebooks
        name: regenerate src/ from notebooks and strip outputs
        entry: make export clean-nbs
        language: system
        pass_filenames: false
        files: ^nbs/.*\.ipynb$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
      - id: ruff-format
